# Deploys the contact-form Worker when a change to it lands on main, so a merged
# Worker fix can't sit undeployed on someone's laptop. CI (ci.yml) still runs the
# Worker's tests on every PR; this re-runs them against the merged tree and then
# deploys.
#
# Needs one repo secret: CLOUDFLARE_API_TOKEN, a token scoped to editing Workers
# on the account in wrangler.toml (dashboard → My Profile → API Tokens → "Edit
# Cloudflare Workers" template). Until it exists every step is skipped and the
# run ends with a warning, so adding the workflow never turns main red.
name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - workers/contact-form/**
      - shared/**
      - .github/workflows/deploy-worker.yml
  # Manual re-deploy from the Actions tab, e.g. after rotating a secret.
  workflow_dispatch:

# Deploys queue rather than cancel: a cancelled deploy mid-upload helps nobody.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/contact-form
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Explain a skipped deploy
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not set, so the Worker was not deployed. Deploy with 'npm run deploy' in workers/contact-form, or add the secret (see OPERATIONS.md)."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CLOUDFLARE_API_TOKEN != ''

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: workers/contact-form/package-lock.json

      - name: Install dependencies
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci

      - name: Run Worker tests
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm test

      # Uses the wrangler from the Worker's own lockfile, so the deploy matches
      # what `npm run deploy` does locally.
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: workers/contact-form
          packageManager: npm
