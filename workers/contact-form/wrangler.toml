# bjohnsoncounseling.com contact-form backend.
#
# A standalone Cloudflare Worker (NOT a Pages Function — Pages Functions don't
# support the send_email binding). Deployed separately from the site with
# `npm run deploy` in this directory; see README.md for the one-time dashboard
# setup (destination address, DNS records, Turnstile secret, deploy).
#
# The route only attaches once bjohnsoncounseling.com is served through
# Cloudflare (i.e. after the DNS migration). Worker routes take precedence over
# Pages on the same path, so /api/contact is served by this Worker while
# everything else stays on Pages.

name = "bjc-contact-form"
main = "src/index.js"
compatibility_date = "2026-06-01"

# The bjohnsoncounseling.com Cloudflare account (not the litbible one). Pinned so
# `wrangler deploy` can't land in the wrong account when you're logged in to more
# than one. Account IDs aren't secret.
account_id = "3cd9c69cc979d425b2a6d0177cff83e1"

# No public *.workers.dev URL — the Worker answers only on the routes below.
workers_dev = false

routes = [
  { pattern = "bjohnsoncounseling.com/api/contact", zone_name = "bjohnsoncounseling.com" },
  { pattern = "www.bjohnsoncounseling.com/api/contact", zone_name = "bjohnsoncounseling.com" }
]

# Send-email binding. The recipient inbox is set as the DEST_EMAIL secret so a
# personal address never lands in the public repo. It must be a verified
# destination address on this Cloudflare account (Compute → Email Service →
# Email Routing → Destination addresses). The domain itself is NOT onboarded to
# Email Routing — that would replace the Google Workspace MX.
[[send_email]]
name = "CONTACT_EMAIL"

# Per-IP cap on submissions (Workers rate-limiting binding — no dashboard rule
# needed): over the limit -> 429 with a "wait a minute" message. Best-effort per
# Cloudflare location — a cost cap, not a security boundary; Turnstile is the
# real bot gate.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "2001"
simple = { limit = 5, period = 60 }

# Workers Logs, so a failed send leaves its error behind (dashboard → Workers &
# Pages → bjc-contact-form → Observability). The Worker never logs form fields —
# only send/Turnstile/rate-limiter errors — so no message content is retained.
[observability]
enabled = true

[vars]
# The sender identity. It doesn't need to exist as a mailbox. Deliverability
# depends on two DNS records on the zone (see README): the cf2024-1 DKIM key and
# include:_spf.mx.cloudflare.net in the apex SPF.
FROM_EMAIL = "contact@bjohnsoncounseling.com"
# Turnstile claims the Worker accepts. TURNSTILE_ACTION must match
# `turnstileAction` in src/config/site.ts. pages.dev is deliberately absent: the
# widget renders there, but its tokens must not unlock the live form.
TURNSTILE_ACTION = "contact"
TURNSTILE_HOSTNAMES = "bjohnsoncounseling.com,www.bjohnsoncounseling.com"

# Secrets (set once with `npx wrangler secret put <NAME>` — see README.md):
#   TURNSTILE_SECRET — the SECRET key of the site's Turnstile widget
#   DEST_EMAIL       — the inbox that receives messages (a verified Email
#                      Routing destination address, e.g. brandon@bjohnsoncounseling.com)
