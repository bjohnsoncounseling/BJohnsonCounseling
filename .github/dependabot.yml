# Dependabot version updates.
#
# Two independent npm trees, each with its own package-lock.json. The worker's
# lockfile is never touched by a root `npm install`, so it needs its own entry.
# GitHub Actions versions (.github/workflows/) get a third, monthly stream.
#
# Shape of each npm stream:
#   - Weekly, Mondays. Minor + patch bumps are bundled into ONE PR.
#   - Majors are deliberately NOT grouped: each gets its own PR so it can be
#     read and tested on its own instead of riding along in a bundle.
#   - 0.x packages are excluded from the bundle (see below) and so also get
#     one PR per release.
#   - Packages that pin each other at an exact version move in a lockstep
#     group of their own (the worker's wrangler + vitest plugin, see below).
#   - No `commit-message` prefix: this repo's history is plain imperative
#     sentences, and Dependabot's default ("Bump x from a to b") already fits.
#
# Not covered here: security ALERT PRs. `groups:` only governs scheduled
# version updates; security PRs follow the repo's "Grouped security updates"
# setting and are not affected by this file.

version: 2

updates:
  # Root: the Astro site (astro, @astrojs/*, fontsource, typescript).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Budget: 1 bundle PR + 1 for @astrojs/check + up to 5 ungrouped majors.
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
        # 0.x direct dependencies. Semver treats a 0.x "minor" (0.9 -> 0.10)
        # as non-breaking, so Dependabot would admit it to this bundle even
        # though a caret range like ^0.9 won't accept it and it can carry
        # transitive majors. Keep this list in step with package.json: any
        # direct dependency whose version starts with 0. belongs here.
        exclude-patterns:
          - '@astrojs/check'

  # Worker: workers/contact-form (wrangler, mimetext). Separate lockfile.
  - package-ecosystem: npm
    directory: /workers/contact-form
    schedule:
      interval: weekly
      day: monday
    # Budget: 1 bundle PR + 1 lockstep PR + up to 2 ungrouped majors (vitest,
    # mimetext), with headroom.
    open-pull-requests-limit: 5
    groups:
      # Listed FIRST: a dependency joins the first group it matches.
      # @cloudflare/vitest-plugin pins wrangler at an exact version (1.5.1 ->
      # wrangler 4.157.0, 1.6.1 -> 4.159.0). Bumping wrangler alone makes npm
      # install a second, nested wrangler under the plugin, so the tests run
      # against a different wrangler from the one that deploys. No
      # update-types filter: a wrangler major must move with the plugin too.
      # It still gets a PR of its own, apart from the minor/patch bundle.
      # Check `npm ls wrangler` shows one copy after merging.
      worker-wrangler-lockstep:
        patterns:
          - wrangler
          - '@cloudflare/vitest-plugin'
      worker-npm-minor-patch:
        update-types:
          - minor
          - patch
        # Already in worker-wrangler-lockstep above; excluded here so the
        # intent survives a reordering of the groups.
        exclude-patterns:
          - wrangler
          - '@cloudflare/vitest-plugin'
        # No 0.x direct dependencies today (wrangler 4.x, mimetext 3.x, vitest
        # 5.x, @cloudflare/vitest-plugin 1.x). If one is added to
        # workers/contact-form/package.json, list it here.

  # Workflows: actions/checkout, actions/setup-node, cloudflare/wrangler-action
  # (SHA-pinned with a version comment; Dependabot updates both). Majors stay
  # ungrouped.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
