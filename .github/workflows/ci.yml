# Runs on each push and PR. Cloudflare Pages already builds the site for every
# PR, but it never type-checks or touches workers/contact-form, so a dependency
# bump there could go green without the Worker ever being built or run.
#
# No secrets needed: the tests use a hand-built env and stub Turnstile.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Astro requires Node >= 22.12; .nvmrc says 24 (current LTS, matches local dev).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails on a known high or critical advisory in the tree. Dependabot
      # alerts cover the same ground on GitHub; this makes it block the merge.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type-check
        run: npm run check

      - name: Build site
        run: npm run build

      # Internal links, and the contact form against the Worker. Reads dist/.
      - name: Check the built site
        run: npm test

  # The Worker is a separate package with its own lockfile, so the root `npm ci`
  # above never installs it and its tests need their own job.
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/contact-form
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: workers/contact-form/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run Worker tests
        run: npm test

      # Bundles the Worker the way `npm run deploy` does, without deploying.
      - name: Check the Worker bundles
        run: npm run check
